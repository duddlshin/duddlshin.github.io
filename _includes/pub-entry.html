<div class="pub-item">
  <p class="pub-title">{% if post.paperurl %}<a href="{{ post.paperurl }}">{{ post.title }}</a>{% else %}{{ post.title }}{% endif %}</p>
  {% if post.author %}<p class="pub-authors">{{ post.author | markdownify | remove: "<p>" | remove: "</p>" }}</p>{% endif %}
  <p class="pub-meta"><em>{{ post.venue }}</em>{% if post.date %} ({{ post.date | date: "%Y" }}){% endif %}</p>
</div>
